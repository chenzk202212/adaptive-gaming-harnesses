name: Code tests

on:
  push:
    paths:
      - 'code/**'
      - '.github/workflows/code-tests.yml'
  pull_request:
    paths:
      - 'code/**'
      - '.github/workflows/code-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-stub-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
      - name: Harness search tests
        run: python -m curriculum.test_kpharness
      - name: Event harness tests
        if: ${{ !cancelled() }}
        run: python -m curriculum.test_kpharness_event
      - name: Recovery knowledge tests
        if: ${{ !cancelled() }}
        run: python -m curriculum.test_harness_skill_bank
      - name: Contextual probe tests
        if: ${{ !cancelled() }}
        run: python -m pytest curriculum/test_contextual_probe_bandit.py -q
